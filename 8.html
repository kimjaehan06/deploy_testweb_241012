<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 점심 추천</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Diphylleia&display=swap');
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        #randomImage {
            width: 300px;
            height: 300px;
            object-fit: cover;
            border: 2px solid #ccc;
            margin-top: 20px;
        }


        li {
            font-size:24px;
        font-family: "Diphylleia", serif;
        font-weight: 400;
        font-style: normal;
        margin-bottom: -10px;
        }
    </style>
</head>
<body>

    <h1>랜덤 점심 추천</h1>
    <p id="randomText">-</p>
    <img id="randomImage" src="img/4.PNG" alt="랜덤 이미지">
    <br><br>
    <button onclick="generateRandom()">오늘 뭐먹지 </button>
    <br><br><br><br>
    <script>
        const items = [
            {
                text: "규카츠 / 15,000원",
                image: "img/1.jpg"
            },
            {
                text: "크림파스타 / 12,000원",
                image: "img/2.jpg"
            },
            {
                text: "메로구이 / 20억",
                image: "img/3.jpg"
            },
        ];

        function generateRandom() {
            const randomIndex = Math.floor(Math.random() * items.length);
            document.getElementById("randomText").innerText = items[randomIndex].text;
            document.getElementById("randomImage").src = items[randomIndex].image;
        }
    </script>
    <div id="container">
      <p>먹고 싶은 메뉴를 메모해보자!</p>
      <p>(먹고싶지 않아진 메뉴는 클릭하여 지울수있다)</p>
      <form action="">
        <input type="text" id="subject" autofocus>
        <button onclick="newRegister(); return false;">추가</button>
      </form>
      <hr>  
      <ul id="itemList"> </ul>  
    </div>
  
    <script>
      function newRegister() {
        var newItem = document.createElement("li");  
        var subject = document.querySelector("#subject");  
  
        if(subject.value === "") {
          alert("내용을 입력하세요!");
          return;
        }
  
        var newText = document.createTextNode(subject.value);  
        newItem.appendChild(newText);  
  
        var itemList = document.querySelector("#itemList");  
        itemList.appendChild(newItem);  
  
        subject.value = "";  
  
        updateItemNumbers();  
  
      
        newItem.addEventListener("click", function() {  
          itemList.removeChild(newItem);  
          updateItemNumbers();  
        });
      }
  
      
      function updateItemNumbers() {
        var items = document.querySelectorAll("li");  
        for (var i = 0; i < items.length; i++) {
          items[i].innerHTML = (i + 1) + ". " + items[i].textContent.replace(/^\d+\.\s/, ""); 
        }
      }
    </script>
