<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>와클릭애따라이미지가바껴오!!</title>
<style>
    
ul {
	list-style: none;
	width:500px;
	margin:10px auto;
	padding:0;
}
li {
	display:inline-block;
	width:120px;
	border:1px solid #ccc;
	padding:10px 15px;	
	font-size:16px;
	text-align:center;
}
    #result {
	width:500px;
	height:300px;
	margin:30px auto;
	border:2px solid #ccc;
	border-radius:15px;
}

</style>
</head>
<body>
    <ul>

        <li class="c"><a href="#" onclick="changeImageAndText('img/1.jpg', '15,000원')">규카츠</a></li>
        <li class="c"><a href="#" onclick="changeImageAndText('img/2.jpg', '12,000원')">크림파스타</a></li>
        <li class="c"><a href="#" onclick="changeImageAndText('img/3.jpg', '20억')">메로구이</a></li>
    </ul>
    
    <div id="result"></div>
    <div id="description"></div>
    
    <script>
        function changeImageAndText(imagePath, descriptionText) {
            var result = document.querySelector('#result');
            var description = document.querySelector('#description');
            
            // 이미지 변경
            result.innerHTML = '<img src="' + imagePath + '" alt="Selected Image" style="width: 100%; height: auto;">';
            
            // 텍스트 변경
            description.innerHTML = '<li>' + descriptionText + '</li>';
        }
    </script>
